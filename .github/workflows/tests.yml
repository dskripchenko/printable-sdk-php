name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none

      # No lock file is committed, so this resolves against current versions —
      # which is the point: the SDK is installed alongside whatever the
      # consumer already has.
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Tests
        run: vendor/bin/pest
